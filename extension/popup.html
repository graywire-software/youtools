<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTools</title>
  <link rel="stylesheet" href="popup.css">
  <script src="settings.js" defer></script>
  <script src="popup.js" defer></script>
  <script src="pwa-shared.js" defer></script>
  <script src="pwa-popup.js" defer></script>
</head>
<body>
  <header><img src="icons/48.png" width="42" height="42" alt=""><div><h1>YouTools<span class="version"></span></h1><p>A little more control.</p></div></header>
  <main>
    <form id="settings" aria-label="YouTools settings"><fieldset disabled id="menus"></fieldset></form>
    <p class="ads-note">Ads and sponsored content stay visible.</p>
  </main>
  <footer><span id="status" role="status" aria-live="polite">Loading preferences...</span><button id="reset" type="button" disabled>Reset</button></footer>
</body>
</html>
